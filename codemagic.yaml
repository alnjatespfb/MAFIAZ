workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 21
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          set -e

          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app

          # 2. تحديد المجلد الرئيسي للمشروع
          SETTINGS_FILE=$(find unzipped_app -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          echo "=== ملف settings.gradle الموجود ==="
          echo "$SETTINGS_FILE"

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "=== مسار المشروع ==="
          echo "$PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # 3. إنشاء ملف debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 4. البناء النهائي للـ APK
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
