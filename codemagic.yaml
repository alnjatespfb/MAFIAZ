workflows:
  android-build:
    name: Build MAFIAZ APK
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Set executable permissions for Gradle
        script: |
          chmod +x gradlew
      - name: Build Android Debug APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
