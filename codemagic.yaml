workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app
          
          # 2. التوجه لمجلد المشروع
          BUILD_FILE=$(find unzipped_app -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          CD_DIR=$(dirname "$BUILD_FILE")
          cd "$CD_DIR"
          
          # 3. إصلاح واستبدال ملف الـ Wrapper المعطوب
          rm -rf gradle/wrapper/gradle-wrapper.jar
          gradle wrapper
          
          # 4. البناء الفعلي للـ APK
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
