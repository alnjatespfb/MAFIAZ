workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          # 1. ضبط نسخة Java لتناسب مشاريع Google AI Studio
          JAVA_HOME=$JAVA_HOME_17
          
          # 2. فك الضغط
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app
          
          # 3. التوجه لمجلد المشروع
          GRADLEW_PATH=$(find unzipped_app -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          
          # 4. إعطاء الصلاحيات والبناء
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
