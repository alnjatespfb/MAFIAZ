workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app
          
          # 2. تحديد المجلد الرئيسي للمشروع
          SETTINGS_FILE=$(find unzipped_app -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_ROOT"
          
          # 3. تحديث رابط Gradle لإصدار 9.3.1 المطلوبة
          sed -i '' 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
          
          # 4. تنزيل الجار وتوليد الـ Wrapper المناسب
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          
          # 5. التثبيت والتسريع والبناء
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
