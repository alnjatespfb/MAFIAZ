workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app
          
          # 2. تحديد المكان الصحيح لملف gradlew
          GRADLEW_PATH=$(find unzipped_app -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          
          # 3. التوجه للمجلد وإعطاء الصلاحيات ثم البناء مباشرة
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
