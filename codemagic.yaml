workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          echo "Found ZIP file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d unzipped_app
          
          # 2. التوجه لمجلد المشروع الرئيسي
          BUILD_FILE=$(find unzipped_app -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          cd $(dirname "$BUILD_FILE")
          
          # 3. التأكد من وجود أداة gradlew وبناء الـ APK
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
