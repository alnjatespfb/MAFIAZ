workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 21
    scripts:
      - name: Extract Zip and Build Native APK
        script: |
          set -e

          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app

          # 2. تحديد المجلد الرئيسي للمشروع
          SETTINGS_FILE=$(find unzipped_app -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          cd "$PROJECT_ROOT"

          # 3. التأكد من وجود gradlew بالإصدار الصحيح (9.3.1)
          if [ -f "gradlew" ]; then
            # لو gradlew موجود بس بإصدار قديم، نحدّثه
            sed -i '' 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true
            chmod +x gradlew
            ./gradlew wrapper --gradle-version 9.3.1
          else
            echo "⚠️ gradlew مش موجود، هنولّده بإصدار 9.3.1"
            gradle wrapper --gradle-version 9.3.1
          fi

          # 4. إنشاء ملف debug.keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # 5. البناء النهائي للـ APK
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
