workflows:
  android-workflow:
    name: Native Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      java: 21
      node: 20
    scripts:
      - name: Extract Zip and Build APK
        script: |
          set -e

          # 1. فك ضغط ملف الـ ZIP
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d unzipped_app

          # 2. طباعة كل ملفات package.json ومحتواها للتشخيص
          echo "=== كل ملفات package.json وموقعها ومحتواها ==="
          find unzipped_app -not -path "*/node_modules/*" -name "package.json" | while read -r f; do
            echo "----- $f -----"
            cat "$f"
            echo ""
          done

          # نوقف هنا عمدًا عشان نشوف النتيجة فورًا
          exit 1
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
