
workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    scripts:
      - name: Build Android APK
        script: |
          # الانتقال للمجلد الذي يحتوي على build.gradle.kts
          BUILD_FILE=$(find . -name build.gradle.kts -o -name build.gradle | head -n 1)
          cd $(dirname "$BUILD_FILE")
          
          # إنشاء نظام Gradle للبناء تلقائياً
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - "**/build/outputs/apk/**/*.apk"
 
