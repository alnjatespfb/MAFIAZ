name: Native Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract Zip and Setup Environment
      run: |
        set -e

        # 1. البحث عن الـ ZIP وفكه
        ZIP_FILE=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ لم يتم العثور على ملف ZIP!"
          exit 1
        fi
        mkdir -p extracted_project
        unzip -o "$ZIP_FILE" -d extracted_project

        # 2. الوصول لمجلد settings.gradle
        SETTINGS_FILE=$(find extracted_project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
        
        # 3. إنشاء ملف debug.keystore في المسار النهائي وحفظ مساره المطلق
        KEYSTORE_PATH="$PROJECT_ROOT/debug.keystore"
        keytool -genkey -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        # نسخ الـ keystore للمسار المطلوب بالظبط اللي الـ Gradle بيطلبه في الشاشة عندك
        mkdir -p unzipped_app
        cp "$KEYSTORE_PATH" unzipped_app/debug.keystore 2>/dev/null || true
        cp "$KEYSTORE_PATH" "$PROJECT_ROOT/app/debug.keystore" 2>/dev/null || true

        # 4. حفظ مسار المشروع كمتغير خطوة
        echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

    - name: Build APK with Gradle
      run: |
        cd "$PROJECT_ROOT"
        
        # تحديث الجرادل
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
        fi

        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 9.3.1
        else
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
        fi

        # البناء مع تجاوز فحص التوقيع معطل إذا وجد
        ./gradlew assembleDebug -x validateSigningDebug || ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: "**/build/outputs/apk/**/*.apk"
