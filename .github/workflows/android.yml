name: Native Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Extract Zip, Setup Gradle, and Build APK
      run: |
        set -e

        # 1. فك ضغط ملف الـ ZIP
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -z "$ZIP_FILE" ]; then
          echo "❌ لم يتم العثور على ملف ZIP!"
          exit 1
        fi
        unzip -o "$ZIP_FILE" -d unzipped_app

        # 2. تحديد المجلد الرئيسي للمشروع
        SETTINGS_FILE=$(find unzipped_app -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
        if [ -z "$SETTINGS_FILE" ]; then
          echo "❌ لم يتم العثور على ملف settings.gradle!"
          exit 1
        fi
        PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
        cd "$PROJECT_ROOT"

        # 3. ضبط وتحديث Gradle Wrapper إلى 9.3.1
        if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
        fi

        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 9.3.1
        else
          echo "⚠️ gradlew غير موجود، سيتم توليده عبر Gradle المثبت..."
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
        fi

        # 4. بناء الـ APK (يمكنك تغيير assembleDebug إلى assembleRelease)
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: "**/build/outputs/apk/**/*.apk"
